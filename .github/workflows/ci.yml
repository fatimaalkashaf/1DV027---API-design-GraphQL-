name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Run Postman tests
        run: newman run postman/videogame-api.postman_collection.json -e postman/production.postman_environment.json --reporters cli