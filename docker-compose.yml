services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE:ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/videogame-api
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      
volumes:
  mongodb_data: